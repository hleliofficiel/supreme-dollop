<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%" style="background:#0b0f19; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161d2f"/>
      <stop offset="100%" stop-color="#0f1423"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#00E5FF" font-size="22" font-weight="800" letter-spacing="1">NOVA MUSIC ARCHITECTURE DIAGRAM</text>
  <text x="450" y="65" text-anchor="middle" fill="#94A3B8" font-size="13">Clean MVVM Architecture &amp; Unidirectional Data Flow</text>

  <!-- Layer 1: UI Layer (Jetpack Compose) -->
  <rect x="50" y="90" width="800" height="95" rx="12" fill="url(#cardGrad)" stroke="#00E5FF" stroke-width="1.5"/>
  <text x="70" y="115" fill="#00E5FF" font-size="14" font-weight="700">UI LAYER (Jetpack Compose Screen Composables)</text>
  <g transform="translate(70, 130)">
    <rect x="0" y="0" width="130" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="65" y="24" text-anchor="middle" fill="#E2E8F0" font-size="12" font-weight="600">HomeScreen</text>

    <rect x="145" y="0" width="130" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="210" y="24" text-anchor="middle" fill="#E2E8F0" font-size="12" font-weight="600">PlayerScreen</text>

    <rect x="290" y="0" width="130" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="355" y="24" text-anchor="middle" fill="#E2E8F0" font-size="12" font-weight="600">LibraryScreen</text>

    <rect x="435" y="0" width="130" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="500" y="24" text-anchor="middle" fill="#E2E8F0" font-size="12" font-weight="600">EqualizerScreen</text>

    <rect x="580" y="0" width="180" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="670" y="24" text-anchor="middle" fill="#E2E8F0" font-size="12" font-weight="600">Settings / Insights</text>
  </g>

  <!-- Arrow Down 1 -->
  <path d="M 450 185 L 450 215" stroke="#00E5FF" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4"/>
  <text x="465" y="203" fill="#94A3B8" font-size="11">StateFlow / Events</text>

  <!-- Layer 2: ViewModels & Playback Manager -->
  <rect x="50" y="215" width="800" height="80" rx="12" fill="url(#cardGrad)" stroke="#7C4DFF" stroke-width="1.5"/>
  <text x="70" y="238" fill="#B388FF" font-size="14" font-weight="700">STATE &amp; PLAYBACK MANAGEMENT LAYER</text>
  <g transform="translate(70, 248)">
    <rect x="0" y="0" width="230" height="36" rx="6" fill="#2d1f47" stroke="#7C4DFF"/>
    <text x="115" y="22" text-anchor="middle" fill="#E2E8F0" font-size="12" font-weight="600">PlaybackManager (Queue &amp; Media)</text>

    <rect x="250" y="0" width="230" height="36" rx="6" fill="#2d1f47" stroke="#7C4DFF"/>
    <text x="365" y="22" text-anchor="middle" fill="#E2E8F0" font-size="12" font-weight="600">EqualizerManager (DSP Pipeline)</text>

    <rect x="500" y="0" width="260" height="36" rx="6" fill="#2d1f47" stroke="#7C4DFF"/>
    <text x="630" y="22" text-anchor="middle" fill="#E2E8F0" font-size="12" font-weight="600">AdManager (AdMob Lifecycle)</text>
  </g>

  <!-- Arrow Down 2 -->
  <path d="M 450 295 L 450 325" stroke="#7C4DFF" stroke-width="2" stroke-dasharray="4"/>
  <text x="465" y="313" fill="#94A3B8" font-size="11">Repository Calls</text>

  <!-- Layer 3: Repository Layer -->
  <rect x="50" y="325" width="800" height="80" rx="12" fill="url(#cardGrad)" stroke="#FF4081" stroke-width="1.5"/>
  <text x="70" y="348" fill="#FF80AB" font-size="14" font-weight="700">REPOSITORY LAYER (Data Orchestration)</text>
  <g transform="translate(70, 358)">
    <rect x="0" y="0" width="175" height="36" rx="6" fill="#3b1728" stroke="#FF4081"/>
    <text x="87" y="22" text-anchor="middle" fill="#E2E8F0" font-size="11" font-weight="600">MusicRepository</text>

    <rect x="190" y="0" width="185" height="36" rx="6" fill="#3b1728" stroke="#FF4081"/>
    <text x="282" y="22" text-anchor="middle" fill="#E2E8F0" font-size="11" font-weight="600">LocalAudioRepository</text>

    <rect x="390" y="0" width="175" height="36" rx="6" fill="#3b1728" stroke="#FF4081"/>
    <text x="477" y="22" text-anchor="middle" fill="#E2E8F0" font-size="11" font-weight="600">LyricsRepository</text>

    <rect x="580" y="0" width="180" height="36" rx="6" fill="#3b1728" stroke="#FF4081"/>
    <text x="670" y="22" text-anchor="middle" fill="#E2E8F0" font-size="11" font-weight="600">SettingsRepository</text>
  </g>

  <!-- Arrow Down 3 -->
  <path d="M 450 405 L 450 435" stroke="#FF4081" stroke-width="2" stroke-dasharray="4"/>
  <text x="465" y="423" fill="#94A3B8" font-size="11">Hardware &amp; API Drivers</text>

  <!-- Layer 4: Data Sources & System Engines -->
  <rect x="50" y="435" width="800" height="90" rx="12" fill="url(#cardGrad)" stroke="#00C853" stroke-width="1.5"/>
  <text x="70" y="458" fill="#69F0AE" font-size="14" font-weight="700">SYSTEM SERVICES &amp; PERSISTENCE LAYER</text>
  <g transform="translate(70, 468)">
    <rect x="0" y="0" width="140" height="42" rx="6" fill="#0a2918" stroke="#00C853"/>
    <text x="70" y="20" text-anchor="middle" fill="#E2E8F0" font-size="11" font-weight="700">Room DB</text>
    <text x="70" y="34" text-anchor="middle" fill="#94A3B8" font-size="9">nova_musique_db</text>

    <rect x="150" y="0" width="150" height="42" rx="6" fill="#0a2918" stroke="#00C853"/>
    <text x="225" y="20" text-anchor="middle" fill="#E2E8F0" font-size="11" font-weight="700">AndroidX Media3</text>
    <text x="225" y="34" text-anchor="middle" fill="#94A3B8" font-size="9">ExoPlayer + Service</text>

    <rect x="310" y="0" width="140" height="42" rx="6" fill="#0a2918" stroke="#00C853"/>
    <text x="380" y="20" text-anchor="middle" fill="#E2E8F0" font-size="11" font-weight="700">MediaStore API</text>
    <text x="380" y="34" text-anchor="middle" fill="#94A3B8" font-size="9">Audio Indexing</text>

    <rect x="460" y="0" width="140" height="42" rx="6" fill="#0a2918" stroke="#00C853"/>
    <text x="530" y="20" text-anchor="middle" fill="#E2E8F0" font-size="11" font-weight="700">LrcLib REST API</text>
    <text x="530" y="34" text-anchor="middle" fill="#94A3B8" font-size="9">LRC Synced Lyrics</text>

    <rect x="610" y="0" width="150" height="42" rx="6" fill="#0a2918" stroke="#00C853"/>
    <text x="685" y="20" text-anchor="middle" fill="#E2E8F0" font-size="11" font-weight="700">AdMob SDK</text>
    <text x="685" y="34" text-anchor="middle" fill="#94A3B8" font-size="9">Banner &amp; Interstitial</text>
  </g>
</svg>